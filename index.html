<!--
================================================================================
  MODULE — MANAGER SES COLLABORATEURS EN TANT QU'ÉLU
  Congrès de la Nouvelle-Calédonie × IFAP — mandature 2026-2031
  Référence d’origine V10 — 24 août 2026.
  CANDIDAT UX18G — embellissement visuel + plan d’action imprimable — 14 septembre 2026.
  Lot 9C : identité pédagogique, grammaire UX et accès aux ressources
  Marie-Noëlle, sans modification du noyau de navigation.
  Empreinte SHA-256 de l’index de référence :
  5653e279adb5aade0eba81c2ec5126a011792228972d4642945e9f3972cf2f93

  La référence V10 reste gelée dans index_REFERENCE_V10.html. Cette copie
  applique le lot 9A : conformité des règles de collecte et de persistance
  (R15/R27 + spécification gabarit §1.3 et §1.7).

  BÂTI SUR GABARIT NOYAU v1.6 (gabarit_noyau_v1_6.html). La V10 de
  référence le reprenait à l'identique (tokens, châssis, SCORM, positionnement ipsatif, modale
  générique, appariement, ordonnancement, tableau à révélation). Conformément
  à la règle de hiérarchie (§1, rang 6) et au principe de gel de version
  (spécification §4.1), LE NOYAU N'AVAIT PAS ÉTÉ MODIFIÉ DANS LA V10 DE RÉFÉRENCE.
  Dans cette copie de travail, le lot 9A a d’abord corrigé les points techniques
  de collecte/persistance non conformes aux documents supérieurs. Le lot 9B
  reprend ensuite le contenu et le cheminement pédagogique à partir des retours
  de Marie-Noëlle, sans modifier la référence V10 gelée. Les couches
  « bibliothèque » (composants CSS/JS préfixés mgt-) et « pédagogie »
  (contenu du module) ont été ajoutées, aux emplacements que le noyau prévoit
  (slots data-slot, écrans insérés entre g-pre et g-eval).

  ── CE QUI EST REPRIS DU GABARIT NOYAU (hors corrections 9A documentées) ──
  · Tokens de la charte graphique (palette Congrès, Arial, espacements).
  · Châssis technique : routeur, sommaire, barre de progression, plein écran,
    modale générique accessible, navigation clavier, reprise de session.
  · Couche SCORM 1.2 en liste blanche stricte (aucun score, aucune note).
  · Positionnement ipsatif en 3 temps (entrée / sortie / rétrospectif) sur
    6 (ici 8) items, avec delta affiché en clôture — mécanique inchangée.
  · Bibliothèque générique : options/feedback (QCM), tableau à révélation,
    GABARIT.appariement() (tap-to-assign), GABARIT.ordonner() (tri par
    boutons ↑/↓), stepper à pastilles (step-pill).

  ── CE QUI EST REPRIS DU PROTOTYPE « ACTION ADMINISTRATIVE »
     (AA_prototype_html_v6_17.html), PAR IMITATION DE PATTERN (pas par copie
     de code module, puisque la structure narrative n'entre jamais dans le
     noyau — spécification §3) ──
  · Le patron de décision à embranchements avec rejeu (« Explorer une autre
    option ») de la fonction scenario() d'AA → repris ici sous
    choixUnique(), utilisé pour les 3 situations d'ouverture de séquence
    (S1-01, S4-03) et les QCM à nuance (S2-04, S4-05, repérage E04).
  · Le patron de stepper de quiz à pastilles, une question à la fois avec
    mélange des options et bilan final (S4 « Les sept questions » chez AA)
    → repris ici sous quizStepper(), utilisé pour les 5 quiz de séquence
    (S1-05, S2-05, S3-06, S4-07, S5-07) et le récapitulatif de g-eval.
  · Le composant media-slot du noyau (déjà présent dans gabarit_noyau) est
    repris tel quel pour tous les emplacements vidéo/photo/HTML prévus au
    plan médias (§12 du scénario) : aucun média n'est simulé, chaque
    emplacement est balisé et nommé (MGT-…) pour la production ultérieure.
  · Le principe des « écrans-cadres figés » (g-contrat, g-pre, g-eval,
    g-post, g-satisf, g-fin) et l'usage exclusif des classes sémantiques du
    noyau (.g-consigne, .g-repere, .g-bon-reflexe, .g-alerte-juridique,
    .g-guidance, .g-apport) sont conservés à l'identique de la pratique AA.

  ── ADAPTATIONS ASSUMÉES ET À ARBITRER (transparence, cf. RÈGLE_hiérarchie) ──
  1. Le scénario (§2, E03) prévoit 3 niveaux de réponse au positionnement
     (« déjà solide / en développement / je souhaite le travailler »). Le
     moteur du noyau encode 4 niveaux fixes (Pas du tout/Plutôt non/Plutôt
     oui/Tout à fait), et le noyau est gelé : ce prototype utilise donc
     l'échelle à 4 niveaux du noyau. Écart à signaler en comité — H5/H6.
  2. Le scénario ne prévoit pas d'évaluation finale centralisée : les 5 quiz
     sont distribués en fin de chaque séquence. L'écran g-eval, obligatoire
     dans le noyau, est ici employé comme RÉCAPITULATIF TRANSVERSAL (une
     question par séquence, reprise de la banque §9) plutôt que comme un
     6ᵉ quiz supplémentaire — à valider : conserver, alléger ou vider ce
     récapitulatif au profit d'un simple message de transition.
  3. S6-01 (« Avec le recul ») est directement porté par les écrans noyau
     g-post + g-retro-bloc (mêmes 8 items qu'à l'entrée). S6-02 à S6-05
     (delta, maintenir/faire évoluer/expérimenter, 3 engagements, feuille de
     route) sont repliés dans le slot libre data-slot="fin" de l'écran de
     clôture g-fin, qui est explicitement prévu en « forme libre » par la
     spécification (§6.3) — aucun écran noyau n'a été ajouté ni déplacé.
  4. Les vidéos, photographies et schémas du plan médias (§12) sont tous en
     l'état d'emplacement balisé (.media-slot), non produits à ce stade.

  ── RETOUR MARC DU 20/08/2026 — INTÉGRÉ ──
  · Les huit défis de l'écran d'accueil ne sont plus énumérotés (1—, 2—…) :
    simple liste à puces.
  5. Sommaire regroupé par séquence (voir commentaire au-dessus de
     construireMenu() dans le script) : le sommaire n'affiche plus qu'une
     entrée par séquence, avec l'intitulé officiel du scénario (§3 à §7) —
     jamais les écrans/activités qui la composent. Inspiré du fonctionnement
     d'« Action administrative » (un panneau = une séquence, sous-navigation
     interne), mais implémenté ici comme un regroupement à l'affichage plutôt
     qu'une fusion des 31 écrans en 5 panneaux : ORDRE, la navigation bas de
     page, le calcul de complétion et le SCORM restent inchangés. À arbitrer :
     si l'équipe souhaite à terme la structure AA « un panneau par séquence »
     à part entière (sous-écrans + rituel interne), c'est une réécriture plus
     profonde du routeur, hors périmètre de cette itération.

  ── APPLICATION DE REGLES_UX_interface_modules_elus.md (R100-R108,
     20/08/2026) — revue UX du même jour, transformée en règles puis
     appliquée à ce prototype dans la foulée ──
  · R100 : écran d'accueil replié — seuls titre/accroche/vidéo/CTA restent
    visibles sans dépli ; défis, durée détaillée, confidentialité complète
    et légende passent dans un <details> natif (#g-contrat-detail), une
    mention de non-collecte courte restant visible avant le bouton.
  · R101 : dev:false dans l'appel GABARIT.init() du module (le noyau gelé
    garde dev:true comme valeur par défaut interne — non modifié, gel de
    version — mais le module l'écrase à l'initialisation).
  · R102/R103 : POSITION_SEQ et SEQ_DUREES ajoutés au script — repère
    « Écran X sur Y » en bas de page, durée estimée par séquence au
    sommaire.
  · R104 : majBoutonSuivant() — le bouton Suivant reste cliquable en toutes
    circonstances (aucun changement de la condition de disabled, position
    dans ORDRE uniquement), un signal visuel discret (grisage + info-bulle
    CSS) apparaît si l'écran courant n'est pas encore complété.
  · R105 : convergence des libellés de bouton vers « Je valide… » /
    « Je continue… » / « Je termine… ». Deux exceptions documentées et
    volontaires : le bouton « Vérifier » de GABARIT.ordonner() et le bouton
    « Je poursuis » d'evalTerminee() sont générés à l'intérieur du noyau
    gelé (lignes < 1688, avant le `return{...}` de l'IIFE GABARIT) — non
    modifiés pour respecter le gel de version. « Je commence » (accueil)
    reste tel quel : une entrée dans le module n'est pas une simple

  · R106 : rendreJauges() (fonction simulateur) affiche désormais la valeur
    chiffrée de chaque jauge et porte role="progressbar" + aria-valuenow/

  · R107 : les apports théoriques de plus de trois lignes mettent en
    évidence leur phrase-clé (<strong>) plutôt qu'un bloc de texte continu.
  · R108 : point de bascule de la mise en page (menu fixe → menu superposé)

  ── IMAGES INTÉGRÉES DU 21/08/2026 ──
  Les 5 images du plan médias (§12) ont été produites par Marc à partir des
  prompts fournis (PROMPTS_IMAGES_MGT_v1.md) et sont intégrées ici en dur,
  chacune remplaçant son .media-slot d'origine par une balise <img> :
  MGT-IMG-ENTREES-SEQUENCES, MGT-IMG-CRISE-DOSSIER, MGT-IMG-SCENE-COMMISSION,

  sous-dossier /media, à côté de ce HTML (convention retenue faute de
  précédent dans les prototypes existants — à confirmer avant packaging

  redimensionnées à 1400px de large max.) pour respecter le plafond de
  200 Ko de R36 — poids d'origine 449 à 568 Ko, ramenés à 161-189 Ko.
  Texte alternatif posé sur chacune conformément au texte fourni dans
  PROMPTS_IMAGES_MGT_v1.md. Seul MGT-VIDEO-INTRO reste en .media-slot

  À FAIRE AVANT VALIDATION HTML (checklist spécification §7) : retirer tout

<style>
/* ===== NOYAU · 1.1 — tokens de la charte, copiés tels quels ===== */
:root {
  /* ==================================================================
     SYSTÈME DE TOKENS v2 — palette 11 rôles, typo 6 tailles.
     Rôles canoniques d'abord ; les anciens noms sont conservés comme
     ALIAS pour que les classes existantes héritent sans réécriture.
     ================================================================== */
  /* --- Neutres (5) · titre (1) --- */
  --blanc:#FFFFFF; --page:#F7F9FB; --ligne:#E3E9EE; --texte-2:#647583; --encre:#263746;
  --bleu-nuit:#2F4354;
  /* --- Accent (rare) --- */
  --or:#F8BB00; --or-survol:#E0A800; --or-texte:#6B4E00; --ivoire:#FFF8E3;
  /* --- Sémantiques (état seulement) --- */
  --succes:#2E7D52; --succes-fond:#E7F4EC; --erreur:#B4453A; --erreur-fond:#FBECEA;
  /* --- Typographie — 6 tailles, 2 graisses --- */
  --fs-legende:13px; --fs-corps:16px; --fs-sous:20px; --fs-section:26px; --fs-ecran:33px; --fs-accueil:42px;
  --poids-normal:400; --poids-fort:600; --interligne:1.6;
  --police:Arial,Helvetica,sans-serif;
  /* --- Espace · rayons · ombre · mesure de lecture --- */
  --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:40px;
  --r-1:10px; --r-2:14px;
  --ombre-carte:0 2px 10px rgba(35,55,70,.05);
  --mesure:68ch;

  /* --- Palette secondaire MGT : repérage pédagogique, issue des fiches --- */
  --mgt-repere-1:#EAF1F5; --mgt-repere-2:#FFF7DF; --mgt-repere-3:#EAF4EF; --mgt-repere-4:#F1ECF6;
  --mgt-accent-1:#58788F; --mgt-accent-2:#B68B00; --mgt-accent-3:#2F6B55; --mgt-accent-4:#705683;

  /* --- ALIAS de compatibilité (anciens noms -> rôles) --- */
  --cnc-or:var(--or); --cnc-or-fonce:var(--or-texte);
  --cnc-gris:var(--texte-2); --cnc-gris-clair:var(--texte-2);
  --bleu-ardoise:var(--bleu-nuit); --gris-doux:var(--texte-2); --bordure:var(--ligne);
  --brume:var(--page); --info-fond:var(--page); --sable:var(--ivoire); --sable-bord:var(--or);
  --fs-titre-module:var(--fs-ecran); --fs-titre-section:var(--fs-section);
  --fs-titre-bloc:var(--fs-sous); --fs-texte:var(--fs-corps); --fs-petit:var(--fs-legende);
  --espace-s:var(--sp-2); --espace-m:var(--sp-3); --espace-l:var(--sp-4);
  --rayon:var(--r-1); --rayon-grand:var(--r-2);
  --ombre:var(--ombre-carte); --ombre-forte:var(--ombre-carte);
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:var(--police);color:var(--encre);line-height:var(--interligne);font-size:var(--fs-corps);background:var(--page)}
:focus-visible{outline:3px solid var(--bleu-ardoise);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:fullscreen{background:var(--page);overflow:auto}
::backdrop{background:var(--page)}

/* ===== NOYAU · 1.4 — châssis (chrome, progression, navigation) ===== */
.g-chrome{position:sticky;top:0;z-index:50;background:var(--bleu-nuit);color:var(--blanc);box-shadow:var(--ombre)}
.g-chrome-inner{max-width:1440px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.g-chrome .g-titre{font-weight:bold;font-size:15px;margin:0;flex:1 1 220px}
.g-chrome .g-titre span{display:block;font-weight:normal;font-size:12.5px;color:#C6D3DD}
.g-chrome-btn{background:transparent;color:var(--blanc);border:1.5px solid #5C7285;border-radius:7px;padding:7px 12px;font-family:var(--police);font-size:13.5px;font-weight:bold;cursor:pointer}
.g-chrome-btn:hover{background:var(--bleu-nuit)}
.g-progression{background:var(--bleu-nuit);height:8px;overflow:hidden}
.g-progression .g-avancee{height:100%;width:0%;background:linear-gradient(90deg,var(--cnc-or),var(--or));transition:width .35s ease}
.g-dev{background:var(--bleu-nuit);color:var(--or);font-size:12.5px;padding:6px 18px;text-align:center}

.g-page{max-width:1440px;margin:0 auto;padding:26px 24px 120px}
.g-layout{display:grid;grid-template-columns:280px minmax(0,980px);gap:28px;align-items:start;justify-content:center}
.g-contenu{min-width:0;max-width:980px;width:100%}
.panel{display:none}.panel.actif{display:block;animation:app .28s ease}
@keyframes app{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.g-menu{display:block;position:sticky;top:86px;max-height:calc(100vh - 116px);max-height:calc(100dvh - 116px);overflow:auto;background:var(--blanc);border:1px solid var(--bordure);border-radius:var(--rayon-grand);box-shadow:var(--ombre);padding:18px 14px}
.g-menu-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 8px 12px}
.g-menu-titre{font-size:18px;color:var(--bleu-nuit);margin:0}
.g-menu-pct{flex:0 0 auto;padding:5px 9px;border-radius:999px;background:var(--info-fond);font-size:13px;font-weight:800;color:var(--bleu-nuit);white-space:nowrap}
.g-menu ol{list-style:none;margin:0;padding:0}.g-menu li{margin:0 0 6px}
.g-menu a{display:grid;grid-template-columns:minmax(0,1fr) 20px;gap:9px;align-items:center;min-height:48px;color:var(--gris-doux);cursor:pointer;text-decoration:none;border:0;border-radius:9px;padding:9px 10px;font-size:13.5px;line-height:1.25}
.g-menu a:hover{background:var(--brume);color:var(--bleu-nuit)}
.g-menu .g-menu-kicker{display:block;color:var(--gris-doux);font-size:10.5px;font-weight:400;letter-spacing:.35px;text-transform:uppercase;margin-bottom:3px}
.g-menu .g-menu-libelle{display:block;color:var(--bleu-nuit);font-size:13.5px;font-weight:650;line-height:1.3}
.g-menu .g-menu-statut{display:grid;place-items:center;width:20px;height:20px;font-size:16px;font-weight:bold}
.g-menu li.est-termine a{background:transparent}
.g-menu li.est-termine .g-menu-statut{color:var(--succes)}
.g-menu li.est-actif a{background:var(--bleu-nuit);color:var(--blanc);box-shadow:inset 4px 0 0 var(--cnc-or)}
.g-menu li.est-actif .g-menu-kicker{color:inherit;opacity:.8}
.g-menu li.est-actif .g-menu-libelle{color:inherit}
.g-menu li.est-actif .g-menu-statut{color:var(--cnc-or)}
.g-menu li.est-a-venir a{color:var(--texte-2)}
.g-menu-outils{border-top:1px solid var(--bordure);margin-top:14px;padding-top:14px}
.g-menu-outils h3{font-size:14px;margin:0 0 8px;color:var(--bleu-nuit)}
.g-menu-outils a{display:block;border:1px solid var(--bordure);padding:9px 10px;margin-top:7px;font-weight:bold}
.g-menu-outils:empty{display:none}
.g-chrome #g-btn-menu{display:none}
.g-nav-bas{position:fixed;bottom:0;left:0;right:0;background:var(--blanc);border-top:1px solid var(--bordure);box-shadow:0 -3px 12px rgba(30,45,58,.07);z-index:40}
.g-nav-bas-inner{max-width:980px;margin:0 auto;padding:12px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.g-nav-bas .g-position{font-size:13px;color:var(--gris-doux)}
/* R108 (REGLES_UX_interface_modules_elus.md) — bascule relevée de 900 à
   1100px : un iPad en orientation paysage (1024px CSS) reste sous ce seuil
   avec l'ancien réglage et gardait la mise en page « bureau » à deux
   colonnes, trop resserrée pour le tri de cartes et les jauges de
   simulateur. */
@media(max-width:1100px){
 .g-page{padding-left:18px;padding-right:18px}.g-layout{display:block}.g-contenu{max-width:none}
 .g-chrome #g-btn-menu{display:inline-block}
 .g-menu{display:none;position:fixed;z-index:70;left:12px;right:12px;top:70px;max-height:calc(100vh - 92px);max-height:calc(100dvh - 92px)}
 .g-menu.ouvert{display:block}
}
@media(max-width:520px){.g-nav-bas .g-position{display:none}.g-nav-bas .btn{flex:1;text-align:center}}
/* R104 — signal discret sur le bouton Suivant quand l'écran n'est pas complété */
.g-btn-incomplet{opacity:.7;position:relative}
.g-btn-incomplet:hover::after,.g-btn-incomplet:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 9px);right:0;background:var(--bleu-nuit);color:var(--blanc);font-size:12.5px;font-weight:normal;padding:7px 11px;border-radius:6px;white-space:nowrap;box-shadow:var(--ombre);pointer-events:none}
@media(max-width:520px){.g-btn-incomplet:hover::after,.g-btn-incomplet:focus-visible::after{white-space:normal;left:0;right:0;bottom:calc(100% + 9px);text-align:center}}

/* ===== NOYAU — typographie & blocs génériques ===== */
.eyebrow{color:var(--cnc-or-fonce);font-weight:bold;text-transform:uppercase;letter-spacing:.8px;font-size:var(--fs-petit);margin:0 0 6px}
h1{font-size:var(--fs-titre-module);color:var(--bleu-nuit);line-height:1.2;margin:0 0 12px}
h2{font-size:var(--fs-titre-section);color:var(--bleu-nuit);margin:var(--espace-l) 0 4px}
h3{font-size:var(--fs-titre-bloc);color:var(--bleu-nuit);margin:var(--espace-m) 0 8px}
p{margin:0 0 12px}.chapo{color:var(--gris-doux);font-size:16px}
.hero{background:var(--bleu-nuit);border-radius:var(--rayon-grand);padding:36px 32px;color:var(--blanc);position:relative;overflow:hidden;margin-bottom:var(--espace-m)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:var(--cnc-or);opacity:.14}
.hero .eyebrow{color:var(--cnc-or)}.hero h1{color:var(--blanc)}.hero p{margin:0;max-width:620px;color:#DCE5EC}

.btn{display:inline-block;padding:13px 22px;border-radius:7px;font-weight:bold;text-decoration:none;font-family:var(--police);font-size:16px;border:none;cursor:pointer}
.btn-primaire{background:var(--bleu-nuit);color:var(--blanc)}.btn-primaire:hover{background:var(--bleu-nuit)}
.btn-accent{background:var(--cnc-or);color:var(--bleu-nuit)}.btn-accent:hover{background:var(--or-survol)}
.btn-secondaire{background:var(--blanc);color:var(--bleu-nuit);border:2px solid var(--bleu-nuit)}.btn-secondaire:hover{background:var(--brume)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.encadre{border-radius:var(--rayon);padding:18px 22px;margin:var(--espace-m) 0}
.encadre-info{background:var(--blanc);border:1px solid var(--ligne)}
.encadre-attention{background:var(--sable);border:1px solid var(--sable-bord)}
.encadre-cle{background:var(--blanc);border:1px solid var(--bordure);box-shadow:var(--ombre)}

/* ---- Écran d'accueil « Bienvenue » — structure standard de tous les modules ---- */
.g-accueil-intro{max-width:1050px;margin-bottom:22px}
.g-accueil-intro h1{max-width:none}
.g-accueil-intro .chapo{max-width:1000px}
.mgt-accueil-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,420px);grid-template-areas:"titre titre" "intro video";column-gap:30px;row-gap:10px;align-items:start;margin-bottom:20px}.mgt-accueil-titre{grid-area:titre}.mgt-accueil-titre h1{margin-bottom:0}.mgt-accueil-hero .g-accueil-intro{grid-area:intro;margin:0}.mgt-accueil-hero .g-accueil-video{grid-area:video;margin:0;max-width:420px;justify-self:end}.mgt-accueil-hero .g-video-legende{font-size:12.5px}
@media(max-width:1100px){.mgt-accueil-hero{grid-template-areas:"titre" "intro" "video"}}
.g-accueil-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.92fr);gap:28px;align-items:start}
.g-objectifs{margin:18px 0;padding:18px 20px;background:var(--ivoire);border:1px solid var(--ligne);border-radius:var(--rayon);color:var(--encre)}
.g-objectifs h2{margin:0 0 8px;color:var(--bleu-nuit);font-size:21px}
.g-objectifs li{margin:7px 0;line-height:1.45}
.g-duree{display:flex;align-items:center;gap:12px;margin:14px 0 0;padding:15px 18px;background:var(--blanc);border:1px solid var(--bordure);border-radius:var(--rayon);box-shadow:var(--ombre);color:var(--encre)}
.g-duree .icone{display:grid;place-items:center;flex:0 0 40px;width:40px;height:40px;border-radius:50%;background:var(--brume);color:var(--bleu-nuit);font-size:20px}
.g-duree p{margin:0;font-size:16px;line-height:1.5}
.g-duree strong{color:var(--bleu-nuit)}
.g-accueil-video{margin:18px 0 0}
.g-accueil-video video,.g-accueil-video iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:var(--rayon-grand);background:var(--bleu-nuit);box-shadow:var(--ombre)}
.g-video-legende{margin:9px 2px 0;color:var(--gris-doux);font-size:14px}
.g-accueil-essentiel{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:22px;align-items:start;margin:22px 0}.g-accueil-essentiel .g-objectifs{margin:0}.g-accueil-essentiel .g-duree{margin:0 0 16px}
.mgt-objectifs-formation{margin:24px 0}.mgt-objectifs-formation h2,.mgt-engagements h2{margin-bottom:12px;color:var(--bleu-nuit)}.mgt-objectifs-liste{display:grid;grid-template-columns:1fr 1fr;gap:9px 24px;margin:0;padding:0;list-style:none;counter-reset:objectif}.mgt-objectifs-liste li{counter-increment:objectif;position:relative;padding:9px 0 9px 38px;border-bottom:1px solid var(--bordure)}.mgt-objectifs-liste li::before{content:counter(objectif);position:absolute;left:0;top:8px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--bleu-nuit);color:#fff;font-weight:800;font-size:13px}
.mgt-engagements{margin:24px 0}.mgt-engagements-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mgt-engagement{padding:14px 16px;background:var(--brume);border-left:4px solid var(--cnc-or);border-radius:0 9px 9px 0}.mgt-engagement strong{display:block;color:var(--bleu-nuit);margin-bottom:3px}.mgt-engagement p{margin:0;font-size:14px;color:var(--texte-2)}
.mgt-personnages{margin:24px 0}.mgt-personnages-entete{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:13px}.mgt-personnages-entete h2{margin:0;color:var(--bleu-nuit)}.mgt-personnages-entete p{margin:0;color:var(--texte-2);font-size:14px}.mgt-personnages-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.mgt-personnage{display:grid;grid-template-columns:92px 1fr;gap:13px;align-items:center;padding:13px;background:#fff;border:1px solid var(--bordure);border-radius:var(--rayon);box-shadow:var(--ombre)}.mgt-personnage img{width:92px;height:92px;object-fit:cover;border-radius:50%;border:3px solid var(--brume)}.mgt-personnage h3{font-size:18px;margin:0 0 3px;color:var(--bleu-nuit)}.mgt-personnage p{font-size:13.5px;margin:0;color:var(--texte-2)}
.mgt-cas-intro{display:grid;grid-template-columns:66px 1fr;gap:13px;align-items:center;margin:9px 0 16px}.mgt-cas-intro img{width:66px;height:66px;object-fit:cover;border-radius:50%;border:3px solid var(--brume)}.mgt-cas-intro .chapo{margin:0}
.mgt-accueil-blocs{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:24px 0}.mgt-accueil-blocs .mgt-objectifs-formation,.mgt-accueil-blocs .mgt-engagements{margin:0}.mgt-accueil-blocs .mgt-objectifs-liste,.mgt-accueil-blocs .mgt-engagements-grid{grid-template-columns:1fr}
.mgt-seq-repere{margin:0 0 28px;padding:0 0 15px 17px;border-left:4px solid var(--cnc-or);border-bottom:1px solid var(--bordure)}.mgt-seq-meta{display:flex;justify-content:space-between;gap:16px;color:var(--bleu-ardoise);font-size:12px;font-weight:700;letter-spacing:.45px;text-transform:uppercase}.mgt-seq-repere h1{font-size:clamp(25px,3.2vw,34px);margin:5px 0 7px;color:var(--bleu-nuit)}.mgt-seq-repere p{margin:0;color:var(--texte-2);font-size:15px}.mgt-activite-type{display:inline-block;margin:0 0 9px;color:var(--bleu-ardoise);font-size:12px;font-weight:800;letter-spacing:.55px;text-transform:uppercase}.mgt-situation-titre{font-size:clamp(23px,2.8vw,29px);margin:0 0 10px;color:var(--bleu-nuit)}
.mgt-guide-card{display:grid;grid-template-columns:108px 1fr;gap:15px;align-items:center;background:var(--bleu-nuit);color:#fff;border-radius:var(--rayon-grand);padding:15px 18px;overflow:hidden}.mgt-guide-card img{display:block;width:108px;height:128px;object-fit:cover;object-position:center 10%;align-self:end}.mgt-guide-card h2{font-size:20px;color:var(--cnc-or);margin:0 0 6px}.mgt-guide-card p{margin:0;font-size:14px}

.g-legende-composants{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.g-legende-composants div{padding:13px;border-radius:9px;border:1px solid var(--bordure);background:#fff}
.g-legende-composants b{display:block;color:var(--bleu-nuit)}
.g-legende-composants span{color:var(--gris-doux);font-size:14px}
@media(max-width:1100px){.g-accueil-grid,.g-legende-composants,.g-accueil-essentiel,.mgt-accueil-hero{grid-template-columns:1fr}.mgt-accueil-hero .g-accueil-video{justify-self:start;width:100%;max-width:480px}.g-accueil-video{margin-top:0}.mgt-personnages-grid{grid-template-columns:1fr 1fr}}@media(max-width:760px){.mgt-accueil-blocs{grid-template-columns:1fr}.mgt-personnages-grid{grid-template-columns:1fr}.mgt-personnages-entete{display:block}.mgt-personnages-entete p{margin-top:5px}}@media(max-width:680px){.mgt-objectifs-liste,.mgt-engagements-grid{grid-template-columns:1fr}}@media(max-width:520px){.mgt-guide-card{grid-template-columns:82px 1fr}.mgt-guide-card img{width:82px;height:108px}.mgt-guidee{padding-right:72px!important}.mgt-guidee::after{right:9px;width:52px;height:52px}.mgt-seq-meta{display:block}.mgt-seq-meta span{display:block;margin-bottom:3px}}
/* R100 — écran d'accueil : détail replié par défaut (<details> natif) */
.g-accueil-detail{margin:16px 0 0;border:1px solid var(--bordure);border-radius:var(--rayon);background:var(--blanc)}
.g-accueil-detail summary{cursor:pointer;list-style:none;padding:15px 18px;font-weight:bold;color:var(--bleu-nuit);display:flex;align-items:center;gap:8px}
.g-accueil-detail summary::-webkit-details-marker{display:none}
.g-accueil-detail summary::before{content:"▸";color:var(--cnc-or-fonce);font-size:14px}
.g-accueil-detail[open] summary::before{content:"▾"}
.g-accueil-detail summary:hover{background:var(--brume)}
.g-accueil-detail>*:not(summary){padding:0 18px 18px}
.g-lien-detail{color:var(--bleu-ardoise);font-weight:bold}
.encadre h4{margin:0 0 6px;color:var(--bleu-nuit);font-size:var(--fs-titre-bloc)}
.encadre p:last-child{margin-bottom:0}

/* R72-R73 — fonctions éditoriales distinctes et stables */
.g-consigne,.g-guidance,.g-apport,.g-alerte-juridique,.g-bon-reflexe,.g-repere,.g-ressource{border-radius:var(--rayon);padding:16px 18px;margin:var(--espace-m) 0}
.g-consigne{background:var(--sable);border:2px solid var(--cnc-or);color:var(--encre)}
.g-consigne::before{content:"À vous d'agir";display:block;font-size:12px;line-height:1.2;font-weight:bold;text-transform:uppercase;letter-spacing:.7px;color:var(--or-texte);margin-bottom:6px}
.g-guidance{background:var(--blanc);border:1px solid var(--ligne);color:var(--texte-2)}
.g-guidance::before{content:"Conseil";display:block;font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:.7px;color:var(--bleu-ardoise);margin-bottom:6px}
.g-apport{background:var(--blanc);border:1px solid var(--bordure);box-shadow:var(--ombre)}
.g-alerte-juridique{background:var(--erreur-fond);border:1px solid var(--erreur)}
.g-alerte-juridique::before{content:"Vigilance juridique";display:block;font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:.7px;color:var(--erreur);margin-bottom:6px}
.g-bon-reflexe{background:var(--succes-fond)}
.g-bon-reflexe::before{content:"Bon réflexe";display:block;font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:.7px;color:var(--succes);margin-bottom:6px}
.g-repere{background:var(--bleu-nuit);color:var(--blanc);border-top:5px solid var(--cnc-or)}
.g-repere::before{content:"Repère à emporter";display:block;font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:.7px;color:var(--cnc-or);margin-bottom:6px}
.g-ressource{background:var(--blanc);border:1px solid var(--bordure);box-shadow:var(--ombre)}
.g-ressource::before{content:"Ressource";display:block;font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:.7px;color:var(--cnc-or-fonce);margin-bottom:6px}
.g-consigne>:last-child,.g-guidance>:last-child,.g-apport>:last-child,.g-alerte-juridique>:last-child,.g-bon-reflexe>:last-child,.g-repere>:last-child,.g-ressource>:last-child{margin-bottom:0}

/* R68 — rituel de séquence */
.g-rituel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:16px 0 24px;padding:8px;background:var(--blanc);border:1px solid var(--bordure);border-radius:var(--rayon)}
.g-rituel span{display:flex;gap:6px;align-items:center;justify-content:center;min-height:44px;padding:7px;border-radius:7px;background:var(--brume);color:var(--texte-2);font-size:13px;font-weight:bold;text-align:center}
.g-rituel span::before{content:attr(data-num);display:grid;place-items:center;flex:0 0 22px;height:22px;border-radius:50%;background:var(--blanc);color:var(--bleu-nuit)}
.g-rituel .est-actif{background:var(--cnc-or);color:var(--bleu-nuit)}.g-rituel .est-fait{background:var(--succes-fond);color:var(--succes)}
@media(max-width:720px){.g-rituel{grid-template-columns:1fr}.g-rituel span{justify-content:flex-start;text-align:left}}

/* R78-R81 — médias lisibles, agrandissables et accessibles */
.g-visuel{margin:var(--espace-m) 0}.g-visuel img{display:block;width:100%;height:auto;border:1px solid var(--bordure);border-radius:var(--rayon)}
.g-visuel-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.g-visuel details{margin-top:10px;font-size:14px;color:var(--gris-doux)}
.g-visuel details summary{cursor:pointer;font-weight:bold;color:var(--bleu-ardoise)}

/* R70 — sous-écrans progressifs */
.g-sous-ecran[hidden]{display:none}.g-sous-ecran-nav{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:24px 0}
.g-sous-ecran-position{color:var(--gris-doux);font-size:14px}

/* Mentions obligatoires injectées par le noyau (spec §1.4) */
.g-confid{display:flex;align-items:center;gap:10px;background:var(--page);border:1px dashed var(--ligne);border-radius:8px;padding:9px 14px;font-size:13.5px;color:var(--texte-2);margin:0 0 var(--espace-m)}
.g-confid strong{color:var(--bleu-nuit)}
.g-droit-date{background:var(--sable);border:1px solid var(--sable-bord);border-radius:8px;padding:10px 14px;font-size:13.5px;color:var(--or-texte);margin:14px 0}
.g-droit-date b{display:block}

/* Bloc « à fournir » — visible en dev, doit disparaître avant packaging */
.a-fournir{background:var(--erreur-fond);border:2px dashed var(--erreur);border-radius:var(--rayon);padding:14px 18px;margin:14px 0;font-size:14.5px;color:var(--erreur)}
.a-fournir b{display:block;margin-bottom:3px;text-transform:uppercase;font-size:12px;letter-spacing:.6px}
.a-fournir code{background:#fff;padding:1px 5px;border-radius:3px;font-size:13px}

/* Emplacement média externe (ressource Moodle) */
.media-slot{border:2px dashed var(--bleu-ardoise);border-radius:var(--rayon);background:var(--page);padding:18px;margin:var(--espace-m) 0;text-align:center;color:var(--gris-doux)}
.media-slot .nom{display:inline-block;background:var(--bleu-nuit);color:var(--blanc);font-size:12px;font-weight:bold;letter-spacing:.5px;padding:3px 9px;border-radius:4px;margin-bottom:8px}
.media-slot p{margin:0;font-size:14.5px}

/* Images intégrées (R31/R33/R36) — remplacent les .media-slot une fois le

.media-img{display:block;width:100%;height:auto;border-radius:var(--rayon-grand);box-shadow:var(--ombre-carte);margin:var(--espace-m) 0}

/* ===== BIBLIOTHÈQUE — composants génériques réutilisables du noyau ===== */
.pyramide{display:flex;flex-direction:column;align-items:center;gap:6px;margin:18px 0}
.niveau{border:none;border-radius:7px;padding:13px 10px;cursor:pointer;font-family:var(--police);font-weight:bold;color:var(--blanc);font-size:15px;background:var(--bleu-nuit);text-align:center}
.niveau:hover{filter:brightness(1.15)}.niveau.on{outline:3px solid var(--cnc-or)}
.n1{width:44%}.n2{width:56%}.n3{width:68%;background:#3B5164}
.n4{width:80%;background:var(--bleu-ardoise)}.n5{width:90%;background:#6E8DA1}.n6{width:100%;background:var(--cnc-gris)}

.rappel{background:var(--blanc);border:1px solid var(--bordure);border-radius:var(--rayon);padding:16px 18px;margin:var(--espace-m) 0;font-size:15px;box-shadow:var(--ombre)}
.rappel .r-titre{color:var(--bleu-nuit);display:block;font-weight:bold;font-size:16px;margin-bottom:6px}
.rappel .r-corps{margin:0 0 10px}
.rappel .r-corps:last-child{margin-bottom:0}
.rappel .r-renvoi{display:block;margin-top:10px;padding-top:10px;border-top:1px dashed var(--bordure);font-size:13.5px;color:var(--gris-doux)}
.rappel .r-renvoi b{color:var(--bleu-ardoise)}

.g-item-pos{background:var(--blanc);border:1px solid var(--bordure);border-radius:var(--rayon);padding:16px 18px;margin-bottom:12px;box-shadow:var(--ombre)}
.g-item-pos p{margin:0 0 10px;font-weight:bold;color:var(--bleu-nuit);font-size:16px}
.g-item-pos[hidden]{display:none}
/* Adaptation n°7 (retour Marc, 20/08/2026) — stepper de positionnement
   « une question à la fois », porté depuis AA_prototype_html_v6_17.html. */
.g-pos-progress{display:grid;gap:8px;margin:0 0 18px;color:var(--gris-doux);font-size:var(--fs-legende);font-weight:var(--poids-fort)}
.g-pos-meta{display:flex;align-items:center;justify-content:space-between;gap:16px}.g-pos-meta strong{color:var(--bleu-nuit)}
.g-pos-barre{height:10px;overflow:hidden;border-radius:999px;background:#dfe7eb}.g-pos-barre i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--cnc-or),var(--bleu-ardoise));transition:width .25s ease}
@media(max-width:560px){.g-pos-meta{align-items:flex-start;flex-direction:column;gap:3px}}
.g-echelle{display:flex;gap:8px;flex-wrap:wrap}
.g-echelle button{flex:1 1 110px;padding:10px 6px;border-radius:7px;border:2px solid var(--bordure);background:var(--blanc);cursor:pointer;font-family:var(--police);font-size:13.5px;color:var(--gris-doux)}
.g-echelle button:hover{border-color:var(--bleu-ardoise)}
.g-echelle button.on{background:var(--bleu-nuit);border-color:var(--bleu-nuit);color:var(--blanc);font-weight:bold}
/* Bilan de positionnement (delta), porté depuis AA_prototype_html_v6_17.html. */
.g-delta-ligne{margin-bottom:14px;padding:18px;background:var(--blanc);border:1px solid var(--bordure);border-radius:var(--rayon);box-shadow:var(--ombre-carte,var(--ombre))}
.g-delta-titre{display:flex;align-items:center;gap:10px;margin:0 0 14px;color:var(--bleu-nuit);font-size:var(--fs-corps)}
.g-delta-num{display:grid;place-items:center;width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:var(--bleu-nuit);color:var(--blanc);font-weight:var(--poids-fort)}
.g-delta-comparaison{display:grid;grid-template-columns:minmax(0,1fr) 38px minmax(0,1fr);gap:10px;align-items:stretch}
.g-delta-etat{padding:12px 14px;border-radius:var(--r-1);background:var(--brume);border:1px solid var(--bordure)}
.g-delta-etat.apres{background:var(--info-fond);border-color:var(--ligne)}
.g-delta-etat small{display:block;margin-bottom:4px;color:var(--gris-doux);font-size:var(--fs-legende);text-transform:uppercase;letter-spacing:.4px;font-weight:var(--poids-fort)}
.g-delta-etat strong{color:var(--bleu-nuit);font-size:var(--fs-corps)}
.g-delta-fleche{display:grid;place-items:center;color:var(--cnc-or-fonce);font-size:var(--fs-section);font-weight:var(--poids-fort)}
.g-delta-statut{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:6px 10px;border-radius:999px;font-size:var(--fs-legende);font-weight:var(--poids-fort)}
.g-delta-statut.progres{background:var(--succes-fond);color:var(--succes)}
.g-delta-statut.stable{background:var(--brume);color:var(--gris-doux)}
.g-delta-statut.consolider{background:var(--sable);color:var(--or-texte)}
.mgt-delta-synthese{display:grid;grid-template-columns:180px 1fr;gap:16px 24px;align-items:center;margin-bottom:22px;padding:22px;border-radius:18px;background:linear-gradient(135deg,#eef4f7,#fff9e8);border:1px solid var(--bordure)}.mgt-delta-pct{display:flex;flex-direction:column}.mgt-delta-pct strong{color:var(--bleu-nuit);font-size:42px;line-height:1}.mgt-delta-pct span{margin-top:6px;color:var(--gris-doux);font-size:13px}.mgt-delta-compteurs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mgt-delta-compteurs span{padding:10px;border-radius:12px;background:#fff;text-align:center}.mgt-delta-compteurs b{display:block;color:var(--bleu-nuit);font-size:23px}.mgt-delta-synthese p{grid-column:1/-1;margin:0}
@media(max-width:600px){.g-delta-comparaison{grid-template-columns:1fr}.g-delta-fleche{transform:rotate(90deg);height:24px}}
@media(max-width:600px){.mgt-delta-synthese{grid-template-columns:1fr}.mgt-delta-compteurs{grid-template-columns:1fr 1fr 1fr}}
.g-legende{font-size:13px;color:var(--gris-doux)}

.options{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.opt{text-align:left;background:var(--blanc);border:2px solid var(--bordure);border-radius:var(--rayon);padding:14px 16px;cursor:pointer;font-family:var(--police);font-size:16px;color:var(--encre);line-height:1.5}
.opt:hover{border-color:var(--bleu-ardoise);background:var(--brume)}
.opt.choisi{border-color:var(--bleu-nuit);background:var(--brume)}
.opt.bon{border-color:var(--succes);background:var(--succes-fond)}
.opt.mauvais{border-color:var(--erreur);background:var(--erreur-fond)}
.opt.neutre{border-color:var(--bleu-ardoise);background:var(--brume)}
.opt[disabled]{cursor:default}
.feedback{border-radius:var(--rayon);padding:15px 18px;margin:12px 0;font-size:16px}
.feedback-ok{background:var(--succes-fond);color:var(--succes)}
.feedback-ko{background:var(--erreur-fond);color:var(--erreur)}
.feedback-neutre{background:var(--blanc);border:1px solid var(--ligne);color:var(--encre)}
.feedback-mi{background:var(--sable);color:var(--or-texte)}
.feedback b{display:block;margin-bottom:3px}

table.tab{width:100%;border-collapse:collapse;background:var(--blanc);border-radius:var(--rayon);overflow:hidden;box-shadow:var(--ombre);margin:var(--espace-m) 0}
table.tab th,table.tab td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--bordure);font-size:15.5px}
table.tab th{background:var(--bleu-nuit);color:var(--blanc);font-size:14px}
table.tab tr:last-child td{border-bottom:none}
table.tab td.masque{color:transparent;background:var(--brume);cursor:pointer;border-radius:4px}
table.tab td.masque::after{content:"Révéler";color:var(--gris-doux);font-size:13px}
@media(max-width:640px){table.tab,table.tab tbody,table.tab tr,table.tab td{display:block;width:100%}table.tab thead{display:none}table.tab tr{border-bottom:2px solid var(--bordure)}}

.stepper-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.step-pill{width:36px;height:36px;border-radius:50%;border:2px solid var(--bordure);background:var(--blanc);color:var(--gris-doux);font-weight:bold;cursor:pointer;font-family:var(--police);font-size:14px}
.step-pill.on{background:var(--bleu-nuit);border-color:var(--bleu-nuit);color:var(--blanc)}
.step-pill.fait{border-color:var(--succes);color:var(--succes);background:var(--succes-fond)}
.extrait{background:var(--page);border:1px solid var(--bordure);border-radius:var(--rayon);padding:16px 18px;margin:14px 0;font-size:15.5px}
.extrait .src{font-size:12.5px;color:var(--gris-doux);text-transform:uppercase;letter-spacing:.5px;margin:0 0 8px}

.fiche{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--blanc);border:1px solid var(--bordure);border-radius:var(--rayon);padding:16px 18px;box-shadow:var(--ombre);margin:var(--espace-m) 0}
.fiche .icone{width:52px;height:66px;border:2px solid var(--bleu-nuit);border-radius:4px;position:relative;flex-shrink:0;background:var(--brume)}
.fiche .icone::after{content:"PDF";position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:11px;font-weight:bold;color:var(--bleu-nuit)}
.fiche .txt{flex:1 1 240px}.fiche .txt b{color:var(--bleu-nuit);display:block}
.fiche .txt span{font-size:14px;color:var(--gris-doux)}
.grille{display:flex;flex-wrap:wrap;gap:16px;margin:var(--espace-m) 0}
.carte{background:var(--blanc);border:1px solid var(--bordure);border-radius:var(--rayon);padding:20px;box-shadow:var(--ombre);flex:1 1 240px}
.carte .filet{width:40px;height:5px;background:var(--cnc-or);border-radius:4px;margin-bottom:12px}
.carte h4{margin:0 0 6px;color:var(--bleu-nuit);font-size:var(--fs-titre-bloc)}.carte p{margin:0}
footer.pied{border-top:2px solid var(--cnc-or);margin-top:var(--espace-l);padding-top:16px;color:var(--gris-doux);font-size:var(--fs-petit)}
footer.pied ul{padding-left:18px;margin:6px 0 0}

button,.btn,.g-chrome-btn,.opt,.g-echelle button,.step-pill,.g-menu a,.niveau,
.g-app-jeton,.g-ordonner-btn,.tab td.masque{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.step-pill{width:44px;height:44px}
.g-echelle button{min-height:44px}
.g-menu a{min-height:44px}
.g-menu{max-height:calc(100vh - 116px);max-height:calc(100dvh - 116px)}

table.tab td.masque{outline-offset:-2px}
table.tab td.masque:focus-visible{outline:3px solid var(--bleu-ardoise)}
table.tab td.revele{color:var(--encre);background:var(--succes-fond)}
table.tab td.revele::after{content:none}

.g-appariement{margin:var(--espace-m) 0}
.g-app-grille{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.g-app-col h4{margin:0 0 10px;font-size:15px;color:var(--bleu-nuit)}
.g-app-liste{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.g-app-jeton{position:relative;display:flex;align-items:center;gap:10px;min-height:52px;
  text-align:left;padding:12px 14px;border:2px solid var(--bordure);border-radius:var(--rayon);
  background:var(--blanc);color:var(--encre);font-family:var(--police);font-size:15.5px;line-height:1.4;cursor:pointer;width:100%}
.g-app-jeton:hover{border-color:var(--bleu-ardoise);background:var(--brume)}
.g-app-jeton.g-app-actif{border-color:var(--cnc-or-fonce);background:var(--sable);box-shadow:0 0 0 3px rgba(248,187,0,.18)}

.g-app-jeton[disabled]{cursor:default}
.g-app-pastille{display:none;flex:0 0 26px;height:26px;border-radius:50%;place-items:center;
  background:var(--bleu-nuit);color:var(--blanc);font-size:13px;font-weight:bold}
.g-app-jeton.g-app-lie .g-app-pastille{display:grid}
.g-app-jeton.g-app-juste{border-color:var(--succes);background:var(--succes-fond)}
.g-app-jeton.g-app-juste .g-app-pastille{background:var(--succes)}
.g-app-jeton.g-app-faux{border-color:var(--erreur);background:var(--erreur-fond)}

.g-app-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.g-app-consigne{font-size:14px;color:var(--gris-doux);margin:0 0 12px}
@media(max-width:600px){.g-app-grille{grid-template-columns:1fr}}

.g-ordonner{list-style:none;margin:var(--espace-m) 0;padding:0;counter-reset:ord}

  background:var(--blanc);border:1px solid var(--bordure);border-radius:var(--rayon);box-shadow:var(--ombre)}
.g-ordonner .g-ordonner-rang{counter-increment:ord;display:grid;place-items:center;flex:0 0 30px;height:30px;
  border-radius:50%;background:var(--bleu-nuit);color:var(--blanc);font-weight:bold;font-size:14px}
.g-ordonner .g-ordonner-rang::before{content:counter(ord)}
.g-ordonner .g-ordonner-txt{flex:1;font-size:15.5px}
.g-ordonner .g-ordonner-cmd{display:flex;flex-direction:column;gap:4px}
.g-ordonner-btn{width:44px;height:26px;border:1.5px solid var(--bordure);border-radius:6px;background:var(--blanc);
  cursor:pointer;font-size:14px;line-height:1;color:var(--bleu-nuit)}
.g-ordonner-btn:hover{background:var(--brume);border-color:var(--bleu-ardoise)}

.g-reprise{margin:0 0 20px;padding:15px 17px;border:1px solid var(--bordure);border-radius:var(--rayon);background:var(--sable)}

.g-reprise-actions .btn,#g-btn-acces{min-height:44px}
@media(max-width:520px){.g-reprise-actions{flex-direction:column}.g-reprise-actions .btn{width:100%}}

.g-modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:rgba(24,38,50,.72);height:100vh;height:100dvh}
.g-modal[hidden]{display:none}
.g-modal-carte{width:min(900px,100%);max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);overflow:auto;padding:26px;border-radius:16px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.g-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.g-modal-head h2{margin:0}
.g-modal-fermer{flex:0 0 44px;width:44px;height:44px;border:0;border-radius:50%;background:var(--brume);color:var(--bleu-nuit);font-size:25px;cursor:pointer;touch-action:manipulation}
.g-modal-corps section+section{margin-top:24px;padding-top:22px;border-top:1px solid var(--bordure)}
.g-acces-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.g-acces-carte{display:block;padding:16px;border:1px solid var(--bordure);border-radius:10px;background:var(--page);color:var(--encre);text-decoration:none;cursor:pointer;font-family:var(--police);text-align:left;min-height:44px}
.g-acces-carte:hover{border-color:var(--bleu-ardoise);background:var(--brume)}
.g-acces-carte b{display:block;color:var(--bleu-nuit);margin-bottom:4px}
.g-acces-carte small{color:var(--gris-doux)}
@media(max-width:600px){.g-acces-grid{grid-template-columns:1fr}}

/* ============================================================================
   MODULE · MANAGER SES COLLABORATEURS — bibliothèque spécifique (mgt-*)
   Composants « pédagogie », hors noyau (spécification §3 : n'entre jamais
   dans le gabarit). Réutilisent exclusivement les tokens du noyau.
   ============================================================================ */
.mgt-repere-defi{display:inline-flex;align-items:center;gap:6px;background:var(--sable);border:1px solid var(--sable-bord);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:bold;color:var(--or-texte);margin:0 0 14px}

.mgt-cards{display:flex;flex-wrap:wrap;gap:14px;margin:16px 0}
.mgt-palier{background:linear-gradient(145deg,#fff 0%,var(--ivoire) 100%);border:1px solid #E6D49A;border-top:5px solid var(--cnc-or);border-radius:var(--rayon-grand);box-shadow:var(--ombre);padding:22px;margin:20px 0}
.mgt-palier-intro{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}.mgt-palier-num{display:grid;place-items:center;flex:0 0 42px;height:42px;border-radius:50%;background:var(--bleu-nuit);color:#fff;font-size:19px;font-weight:800}.mgt-palier-intro p{margin:0}
.mgt-modele{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}.mgt-modele.quatre{grid-template-columns:repeat(4,minmax(0,1fr))}.mgt-modele-card{background:#fff;border:1px solid var(--bordure);border-radius:10px;padding:15px}.mgt-modele-card h3{font-size:16px;margin:0 0 7px;color:var(--bleu-nuit)}.mgt-modele-card p,.mgt-modele-card li{font-size:14px}.mgt-modele-card p:last-child{margin-bottom:0}
.mgt-essentiel{background:var(--bleu-nuit);color:#fff;border-radius:10px;padding:17px 19px;margin:18px 0}.mgt-essentiel strong{color:var(--cnc-or)}.mgt-essentiel p{margin:0}
.mgt-pause{border-left:5px solid var(--cnc-or);background:#fff;padding:14px 16px;margin:18px 0}.mgt-pause p{margin:0}.mgt-source{margin-top:16px;font-size:13px;color:var(--gris-doux)}.mgt-source summary{cursor:pointer;font-weight:700;color:var(--bleu-nuit)}
@media(max-width:780px){.mgt-modele,.mgt-modele.quatre{grid-template-columns:1fr 1fr}}@media(max-width:520px){.mgt-modele,.mgt-modele.quatre{grid-template-columns:1fr}.mgt-palier{padding:17px}.mgt-palier-intro{display:block}.mgt-palier-num{margin-bottom:10px}}

.mgt-card.on{border-color:var(--cnc-or-fonce);background:var(--ivoire)}
.mgt-card.juste{border-color:var(--succes);background:var(--succes-fond)}
.mgt-card.faux{border-color:var(--erreur);background:var(--erreur-fond)}
.mgt-card b{display:block;color:var(--bleu-nuit);margin-bottom:4px}
.mgt-card[disabled],.mgt-card.desactive{cursor:default;opacity:.7}
.mgt-card span{font-size:13.5px;color:var(--gris-doux)}

.mgt-jauges{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}

.mgt-jauge-valeur{font-weight:normal;color:var(--gris-doux)}
.mgt-jauge-barre{background:var(--ligne);border-radius:20px;height:12px;overflow:hidden}
.mgt-jauge-barre i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--or),var(--cnc-or));transition:width .4s ease}
@media(max-width:600px){.mgt-jauges{grid-template-columns:1fr}}

.mgt-sim-progression{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--brume);border:1px solid var(--bordure)}

.mgt-sim-synthese{margin-top:16px;padding:22px;border:1px solid var(--bordure);border-radius:18px;background:linear-gradient(145deg,var(--brume),#fff 64%);box-shadow:var(--ombre-carte)}
.mgt-sim-synthese h3{margin:0 0 8px;color:var(--bleu-nuit)}
.mgt-sim-synthese-intro{margin:0 0 16px;color:var(--gris-doux)}
